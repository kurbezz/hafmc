server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Логирование
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Основная локация
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Отключение кэширования для HTML файлов
    location ~* \.(html)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Кэширование статических файлов
    location ~* \.(jpg|jpeg|png|gif|webp|avif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Манифест игр может обновляться — короткий кэш с ревалидацией,
    # чтобы не запрашивать на каждый переход, но подхватывать изменения быстро.
    location ~* \.(json)$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # Безопасность заголовков
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Отключение показа версии nginx
    server_tokens off;
}
